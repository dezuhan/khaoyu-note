app-id: com.dezuhan.khaoyunote
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: khaoyu-note

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --share=network
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.secrets

modules:
  - name: khaoyu-note
    buildsystem: simple
    build-commands:
      - mkdir -p /app/bin /app/share/applications /app/share/icons /app/share/metainfo
      - cp -a appdir/usr/bin/. /app/bin/
      - chmod +x /app/bin/*
      - for icon in appdir/usr/share/icons/hicolor/*/apps/khaoyu-note.png; do
          size="$(basename "$(dirname "$(dirname "$icon")")")";
          install -Dm644 "$icon" "/app/share/icons/hicolor/${size}/apps/com.dezuhan.khaoyunote.png";
        done
      - install -Dm644 "appdir/usr/share/applications/Khaoyu Note.desktop" /app/share/applications/com.dezuhan.khaoyunote.desktop
      - sed -i 's/^Icon=.*/Icon=com.dezuhan.khaoyunote/' /app/share/applications/com.dezuhan.khaoyunote.desktop
      - sed -i 's/^Exec=.*/Exec=khaoyu-note/' /app/share/applications/com.dezuhan.khaoyunote.desktop
      - install -Dm644 com.dezuhan.khaoyunote.metainfo.xml /app/share/metainfo/com.dezuhan.khaoyunote.metainfo.xml
    sources:
      - type: dir
        path: appdir
        dest: appdir
      - type: file
        path: com.dezuhan.khaoyunote.metainfo.xml
