<!doctype html>
<html lang="en" data-ky-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khaoyu Note</title>
    <link rel="icon" type="image/svg+xml" href="./assets/khaoyu-note.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="./assets/favicon-180.png" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./vendor/ky.css" />
    <link rel="stylesheet" href="./vendor/components.css" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body class="ky-scope">
    <div id="app" class="mn-app" hidden>
      <nav class="mn-menubar" id="menubar" aria-label="Application menu">
        <div class="mn-menubar-left">
          <button type="button" class="mn-logo" id="home-btn" title="Template library" aria-label="Khaoyu Note">
            <img class="mn-logo-mark" src="./assets/khaoyu-note.svg" alt="" />
          </button>
        </div>
        <div class="mn-menubar-center">
          <button
            type="button"
            class="mn-topbar-search"
            id="command-search-btn"
            title="Search commands (Ctrl+K)"
            aria-label="Search commands"
          ></button>
        </div>
        <div class="mn-menubar-right">
          <button type="button" class="mn-icon-btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled></button>
          <button type="button" class="mn-icon-btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled></button>
          <span class="mn-topbar-sep"></span>
          <span class="mn-comment-count" id="comment-count" title="Comment cards"></span>
          <button type="button" class="mn-icon-btn" id="notification-btn" title="Notifications"></button>
          <button type="button" class="mn-icon-btn" id="help-btn" title="Keyboard shortcuts"></button>
          <button type="button" class="mn-icon-btn" id="theme-btn" title="Toggle theme"></button>
          <button type="button" class="mn-icon-btn" id="language-btn" title="Language" aria-label="Language"></button>
          <button type="button" class="mn-icon-btn" id="settings-btn" title="Settings"></button>
        </div>
      </nav>
      <header class="mn-topbar">
        <div class="mn-topbar-left">
          <button type="button" class="mn-template-btn" id="template-btn" title="Template library"></button>
          <nav class="mn-breadcrumb" id="breadcrumb" aria-label="Board path"></nav>
          <span class="mn-save-state" id="save-state">Saved</span>
        </div>
        <div class="mn-topbar-right">
          <button type="button" class="mn-sync-state" id="sync-state" data-status="disabled" title="Server sync">Sync off</button>
          <button type="button" class="mn-access-btn" id="share-btn" title="Board access and share links">
            <span class="mn-access-label">Share</span>
          </button>
          <button
            type="button"
            class="mn-account-btn"
            id="account-btn"
            title="Account menu"
            aria-label="Account menu"
            aria-haspopup="dialog"
          ></button>
        </div>
      </header>

      <div class="mn-main">
        <nav class="mn-toolrail" id="toolrail" aria-label="Card tools"></nav>

        <div class="mn-viewport" id="viewport">
          <div class="mn-world" id="world">
            <svg
              class="mn-connections"
              id="connections"
              xmlns="http://www.w3.org/2000/svg"
            ></svg>
            <div class="mn-cards" id="cards"></div>
          </div>

          <div class="mn-zoom" role="group" aria-label="Zoom">
            <button type="button" class="mn-zoom-btn" data-zoom="out" title="Zoom out">-</button>
            <span class="mn-zoom-label" id="zoom-label">100%</span>
            <button type="button" class="mn-zoom-btn" data-zoom="in" title="Zoom in">+</button>
            <button type="button" class="mn-zoom-btn" data-zoom="reset" title="Reset zoom">1:1</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mn-menu-layer" id="menu-layer"></div>
    <div id="modal-layer"></div>
    <div class="mn-home" id="home-page" hidden></div>
    <div class="mn-toast" id="toast" hidden></div>
    <div id="boot">Loading board...</div>

    <script src="./vendor/ky.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
