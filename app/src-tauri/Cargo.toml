[package]
name = "khaoyu-note"
version = "0.25.1"
description = "Local-first visual notes and boards"
edition = "2021"
rust-version = "1.77"
default-run = "khaoyu-note"

[lib]
name = "khaoyu_note_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "khaoyu-note"
path = "src/main.rs"

[[bin]]
name = "khaoyu-note-mcp"
path = "src/bin/khaoyu-note-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

