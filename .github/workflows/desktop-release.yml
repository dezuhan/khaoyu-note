name: Desktop release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    # macOS runners are unavailable on some repository plans; keep Windows/Linux artifacts publishable.
    continue-on-error: ${{ matrix.name == 'macOS universal' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            artifact: khaoyu-note-windows-x64
            args: ""
            paths: |
              app/src-tauri/target/release/bundle/nsis/*.exe
              app/src-tauri/target/release/bundle/msi/*.msi
              app/src-tauri/target/release/khaoyu-note.exe
              app/src-tauri/target/release/khaoyu-note-mcp.exe
          - name: Linux x64
            runner: ubuntu-24.04
            artifact: khaoyu-note-linux-x64
            args: "--bundles deb,rpm,appimage"
            paths: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/appimage/*.AppDir/**
              app/src-tauri/target/release/bundle/deb/*.deb
              app/src-tauri/target/release/bundle/rpm/*.rpm
              app/src-tauri/target/release/khaoyu-note
              app/src-tauri/target/release/khaoyu-note-mcp
          - name: macOS universal
            runner: macos-latest
            artifact: khaoyu-note-macos-universal
            args: "--target universal-apple-darwin"
            paths: |
              app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
              app/src-tauri/target/universal-apple-darwin/release/khaoyu-note
              app/src-tauri/target/universal-apple-darwin/release/khaoyu-note-mcp

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install WiX
        if: runner.os == 'Windows'
        run: choco install wixtoolset --no-progress -y

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential \
            rpm \
            curl wget file

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build universal MCP sidecar (macOS)
        if: runner.os == 'macOS'
        working-directory: app/src-tauri
        run: |
          mkdir -p target/universal-apple-darwin/release
          cargo build --release --target aarch64-apple-darwin --bin khaoyu-note-mcp
          cargo build --release --target x86_64-apple-darwin --bin khaoyu-note-mcp
          lipo -create \
            target/aarch64-apple-darwin/release/khaoyu-note-mcp \
            target/x86_64-apple-darwin/release/khaoyu-note-mcp \
            -output target/universal-apple-darwin/release/khaoyu-note-mcp

      - name: Build desktop bundles
        working-directory: app
        shell: bash
        env:
          CI: "true"
          # Unsigned macOS builds. A corrupt/missing Apple certificate makes Tauri fail with
          # SecKeychainItemImport before it can produce the DMG. Restore the signed values only
          # after the certificate, password and identity have been re-encoded and verified.
          APPLE_CERTIFICATE: ""
          APPLE_CERTIFICATE_PASSWORD: ""
          APPLE_SIGNING_IDENTITY: ""
          APPLE_ID: ""
          APPLE_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: |
          set -o pipefail
          npx tauri build ${{ matrix.args }} 2>&1 | tee tauri-build.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            detail="$(grep -m1 -E 'error:|Error:|failed to|Cannot find|cannot|No such file' tauri-build.log || true)"
            if [ -z "$detail" ]; then detail="$(tail -n 4 tauri-build.log)"; fi
            echo "::error title=Desktop bundle failed::${detail:0:900}"
          fi
          exit "$status"

      - name: Upload bundled artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: warn
          retention-days: 14

  flatpak:
    name: Linux Flatpak
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A Flatpak runtime/AppDir mismatch must not hide the other installers.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download Linux build
        uses: actions/download-artifact@v8.0.2
        with:
          name: khaoyu-note-linux-x64
          path: linux-build

      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.gnome.Platform//48 org.gnome.Sdk//48

      - name: Prepare AppDir and build Flatpak
        run: |
          find linux-build -maxdepth 5 -type f | head -50
          appdir="$(find linux-build -type d -name '*.AppDir' | head -n 1)"
          test -n "$appdir"
          rm -rf packaging/flatpak/appdir packaging/flatpak/build packaging/flatpak/repo
          cp -a "$appdir" packaging/flatpak/appdir
          # upload-artifact does not preserve executable bits.
          chmod +x packaging/flatpak/appdir/AppRun
          find packaging/flatpak/appdir/usr/bin -type f -exec chmod +x {} +
          flatpak-builder --disable-rofiles-fuse --force-clean \
            --repo=packaging/flatpak/repo packaging/flatpak/build \
            packaging/flatpak/com.dezuhan.khaoyunote.yml
          version="$(node -p "require('./app/src-tauri/tauri.conf.json').version")"
          flatpak build-bundle packaging/flatpak/repo \
            "Khaoyu-Note_${version}_amd64.flatpak" com.dezuhan.khaoyunote

      - name: Upload Flatpak
        uses: actions/upload-artifact@v7.0.2
        with:
          name: khaoyu-note-linux-flatpak
          path: Khaoyu-Note_*.flatpak
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: [build, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-input

      - name: Package installers
        run: |
          mkdir -p release
          find release-input -type f \(             -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o             -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o             -name '*.flatpak' -o -name '*.tar.gz'           \) -exec cp {} release/ \;
          # Keep .app bundles as ZIPs; macOS bundles are directories.
          find release-input -type d -name '*.app' -print0 | while IFS= read -r -d '' app; do
            name="$(basename "$app")"
            (cd "$(dirname "$app")" && zip -qr "$GITHUB_WORKSPACE/release/${name}.zip" "$name")
          done || true
          if [ -n "$(find release -type f -print -quit)" ]; then
            (cd release && sha256sum * > SHA256SUMS.txt)
          else
            echo "No installer artifacts were produced" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            release/*
          generate_release_notes: true
