name: khaoyu-note-service

services:
  khaoyu-note-service:
    build: .
    image: khaoyu-note-service:0.36.0
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      KHAOYU_SERVICE_HOST: 0.0.0.0
      KHAOYU_SERVICE_FRONTEND_PORT: 18080
      KHAOYU_SERVICE_BACKEND_PORT: 18081
      KHAOYU_SERVICE_DATA_DIR: /data
    ports:
      - "127.0.0.1:18080:18080"
      - "127.0.0.1:18081:18081"
    volumes:
      - khaoyu-service-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18080/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s

  # Team-profile backend. These services are opt-in until the storage adapter is wired into the
  # service process: docker compose --profile team up -d
  postgres:
    image: postgres:17-alpine
    profiles: ["team"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KHAOYU_SERVICE_POSTGRES_DB:-khaoyu}
      POSTGRES_USER: ${KHAOYU_SERVICE_POSTGRES_USER:-khaoyu}
      POSTGRES_PASSWORD: ${KHAOYU_SERVICE_POSTGRES_PASSWORD:?set KHAOYU_SERVICE_POSTGRES_PASSWORD}
    volumes:
      - khaoyu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    profiles: ["team"]
    restart: unless-stopped
    environment:
      KHAOYU_SERVICE_REDIS_PASSWORD: ${KHAOYU_SERVICE_REDIS_PASSWORD:?set KHAOYU_SERVICE_REDIS_PASSWORD}
    command:
      - redis-server
      - --requirepass
      - ${KHAOYU_SERVICE_REDIS_PASSWORD:?set KHAOYU_SERVICE_REDIS_PASSWORD}
      - --appendonly
      - "no"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$KHAOYU_SERVICE_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  khaoyu-service-data:
  khaoyu-postgres-data:
