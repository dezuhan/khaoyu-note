<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Khaoyu Note passkeys</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #111; color: #eee; display: grid; place-items: center; min-height: 100vh; }
      main { width: min(520px, calc(100vw - 40px)); background: #1b1b1b; border: 1px solid #333; border-radius: 10px; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      p { color: #aaa; font-size: 13px; line-height: 1.5; }
      section { border-top: 1px solid #333; margin-top: 16px; padding-top: 16px; }
      label { display: block; font-size: 12px; color: #aaa; margin: 10px 0 4px; }
      input { width: 100%; box-sizing: border-box; padding: 9px; border-radius: 6px; border: 1px solid #444; background: #111; color: #eee; }
      button { margin-top: 10px; padding: 9px 12px; border-radius: 6px; border: 1px solid #555; background: #eee; color: #111; cursor: pointer; font-weight: 600; }
      button.secondary { background: transparent; color: #eee; }
      button:disabled { opacity: 0.45; cursor: default; }
      #status { min-height: 18px; font-size: 12px; color: #9ad; margin-top: 8px; }
      ul { padding-left: 18px; font-size: 13px; color: #bbb; }
      code { color: #ccc; }
    </style>
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body>
    <main>
      <h1>Khaoyu Note passkeys</h1>
      <p>Use a passkey on this device. Passkeys require a secure context, such as localhost or HTTPS.</p>

      <section>
        <label for="login-email">Email</label>
        <input id="login-email" type="email" autocomplete="username" />
        <label for="login-password">Password</label>
        <input id="login-password" type="password" autocomplete="current-password" />
        <button id="login">Sign in with password</button>
      </section>

      <section>
        <label for="passkey-email">Passkey email</label>
        <input id="passkey-email" type="email" autocomplete="username" />
        <button id="passkey-login" class="secondary">Sign in with passkey</button>
      </section>

      <section>
        <p>Add a passkey to the signed-in account. The last passkey cannot be removed when the account has no password.</p>
        <button id="passkey-register">Register a passkey</button>
        <button id="logout" class="secondary">Sign out</button>
        <ul id="passkey-list"></ul>
      </section>

      <div id="status" role="status"></div>
    </main>
    <script type="module" src="/passkeys.js"></script>
  </body>
</html>
