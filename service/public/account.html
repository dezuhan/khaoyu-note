<!doctype html>
<html lang="en" data-ky-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Account · Khaoyu Note</title>
    <link rel="stylesheet" href="/ky.css" />
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body class="ky-scope">
    <main class="ky-panel ky-auth-panel">
      <h1 class="ky-title">Khaoyu Note account</h1>
      <p>Manage the self-hosted service account on this device. Boards stay local-first.</p>

      <section id="account-section" hidden>
        <h2>Signed in</h2>
        <p id="account-email" class="muted"></p>
        <div class="row">
          <a class="ky-button ky-button-quiet" href="/reset">Reset password</a>
          <a class="ky-button ky-button-quiet" href="/passkeys">Passkeys</a>
          <button id="logout" type="button" class="ky-button ky-button-quiet">Sign out</button>
          <button id="logout-all" type="button" class="ky-button ky-button-danger">Sign out everywhere</button>
        </div>
        <p class="muted"><a href="/admin">Open the service admin dashboard</a></p>

        <h2 style="margin-top: 18px">Sessions</h2>
        <ul id="sessions"></ul>

        <h2 style="margin-top: 18px">API tokens for desktop sync</h2>
        <label class="ky-label" for="token-name">Token name</label>
        <input class="ky-input" id="token-name" value="Desktop sync" />
        <button class="ky-button ky-button-primary" id="token-create" type="button">Create token</button>
        <p id="token-result"></p>
        <ul id="tokens"></ul>
      </section>

      <p id="redirect-note" hidden>Signing in is required. Redirecting to the login page...</p>
      <div id="status" role="status"></div>
    </main>
    <script type="module" src="/account.js"></script>
  </body>
</html>
