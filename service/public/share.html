<!doctype html>
<html lang="en" data-ky-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Shared Khaoyu Note</title>
    <link rel="icon" type="image/svg+xml" href="/khaoyu-note.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
      <link rel="stylesheet" href="/fonts.css" />
      <link rel="stylesheet" href="/ky.css" />
    <link rel="stylesheet" href="/ui.css" />
  </head>
  <body class="ky-scope">
    <main class="ky-panel ky-auth-panel">
      <header>
        <h1 id="title">Shared Khaoyu Note</h1>
        <span class="badge" id="permission">view</span>
      </header>
      <section class="panel" id="unlock">
        <p>This link is protected by a passphrase. Enter it to continue.</p>
        <div class="row">
          <input class="ky-input" id="passphrase" type="password" placeholder="Passphrase" autocomplete="current-password" />
          <button class="ky-button ky-button-primary" id="open" type="button">Open</button>
        </div>
      </section>
      <div id="status" role="status"></div>
      <div id="content"></div>
    </main>
    <script type="module" src="/theme-init.js"></script>
    <script type="module" src="/share-view.js"></script>
  </body>
</html>
